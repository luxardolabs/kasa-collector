name: gitleaks

# Server-side secret scan on the public mirror — the backstop so a skipped local
# pre-commit hook can't let a credential through (luxlint --doc ONBOARDING §4a).
#
# This runs gitleaks' DEFAULT ruleset (credential shapes: API keys, tokens, high-entropy
# blobs). The fleet ORG-DENYLIST (internal infra / retired identity) is deliberately NOT
# shipped here — a committed config would print the very strings it forbids in a public
# repo. That layer is enforced pre-push via `make gitleaks` / `make check` / the local
# pre-commit hook, all using the canonical config emitted from the private luxlint image.

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, so detect scans every commit
      - name: gitleaks detect
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact -v
