[project]
name = "kasa-collector"
dynamic = ["version"]
description = "Data collection service for TP-Link Kasa smart plugs and power strips — discovers devices, collects energy metrics, and writes to InfluxDB."
authors = [{ name = "Luxardo Labs" }]
license = "AGPL-3.0-only"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "aiofiles>=25.1.0,<26.0.0",
    "influxdb-client>=1.50.0,<2.0.0",
    "python-kasa>=0.11.0.1,<0.12.0",
    # --- Transitive security floors (luxaudit) ---
    # These are pulled in by influxdb-client (async) and python-kasa, whose ranges are
    # unbounded above — so a plain re-lock resolves straight back to the vulnerable
    # version and "re-locked = patched" is a trap (luxaudit 0.1.10). The floor has to be
    # declared HERE, in our own manifest, so the lock cannot pick below the fix.
    # aiohttp: CVE-2026-69244 (OOB heap read in the C response parser while building an
    # error message for a malformed response — we are a client, so a misbehaving device
    # or InfluxDB reaches it), CVE-2026-69243, CVE-2026-59881. Fixed in 3.14.3.
    "aiohttp>=3.14.3",
    # cryptography: CVE-2026-69247 (pkcs7_decrypt_* distinguishable outcomes). Fixed in 50.0.0.
    "cryptography>=50.0.0",
]

# The fleet build backend is hatchling (repo.hatchling_build_backend) and the VERSION file is
# the ONE version literal (repo.version_single_source) — everything else derives, so the
# pyproject/VERSION drift that had us at 2025.7.0 here while VERSION said 2026.8.0 cannot recur.
# Poetry remains the dependency manager and poetry.lock is unaffected; both Dockerfiles run
# `poetry install --no-root`, so the backend is never exercised at image-build time.
[tool.hatch.version]
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Poetry is the DEPENDENCY MANAGER here, not the build backend — so it runs in
# non-package mode. Both Dockerfiles do `poetry install --no-root` (deps only; the app is
# copied in, never wheel-installed), so Poetry never needs to build or version this project.
# This is also what keeps repo.version_single_source honest: package mode would demand a
# `[tool.poetry] version = "..."` literal, i.e. exactly the second version declaration that
# drifted from VERSION in the first place. The version has one home: the VERSION file.
[tool.poetry]
package-mode = false

# The dev group exists for ONE consumer: the pytest suite (the Dockerfile's `test` stage
# installs `--with dev`; `coverage` is what `make test` measures branch coverage with). ruff, mypy and the types-* stubs are deliberately NOT here — since the
# mount-only migration, luxlint runs ruff and mypy inside its own pinned image against the
# mounted repo, so a copy in this group is never invoked by any make target and is invisible
# to `make mypy` (that run resolves only against luxlint's baked typed-dependency union).
# Keeping them would pin a second, drifting version of the very tools the guard owns — the
# drift luxlint exists to kill — and drag mypy's compiled runtime (ast-serialize, librt)
# into both the lock and the test image for nothing.
[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
coverage = "^7.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The ruff (lint + format) and mypy configuration is owned by luxlint — the fleet
# code-style guard — and is NOT kept here. See .luxlint.toml and `make lint`. A
# repo-local ruff/mypy config is exactly the drift luxlint's no_local_ruff_config /
# no_local_mypy_config checks flag; emit the canonical config for your editor with
# `docker run --rm $LUXLINT_IMAGE --emit-config ruff > .ruff.local.toml` (gitignored).

# The pytest configuration is likewise owned by luxlint (test.no_local_pytest_config)
# and is NOT kept here — a repo-local pytest config is exactly the drift that check
# flags. `make test` (luxarch's test block) emits it per run (`luxlint --emit-config
# pytest`) into a throwaway directory and runs `pytest -c <it>`. See .luxlint.toml / test-suite
# playbook (`luxlint --playbook test-suite`).
