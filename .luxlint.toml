# luxlint — fleet code-style + type standard (sibling of luxarch's .luxarch.toml).
# Carries only where to look + what's deferred; the ruff/mypy config lives in the image.
# Run via `make lint`; see /mnt/luxardolabs/luxlint/docs/REFERENCE.md for the schema.

[source]
# `harness` is covered rather than excluded: fake_kasa.py is first-party code we maintain
# and ship in the demo/e2e stacks (harness/Dockerfile builds it), so it is style-held like
# any other source. Excluding it would be the hollow green lint.source_declared exists to
# close — `make lint` passing having never scanned a file a bare `ruff .` would.
paths = ["app", "harness"]

# Evidence-backed carve-outs for genuine false positives. Scoped to code+file+match, so a
# NEW violation of the same code anywhere else still reds, and a carve-out that stops
# suppressing anything is itself a red — it can never bless forever.
#
# The entry below is the same class luxlint recognises for `.claude/hooks/**` (0.39.1):
# "printing to stdout IS the protocol." T20 bans print in APPLICATION code because it
# bypasses the log aggregator — correct, and app/main.py's print was a real hit we fixed
# to logger.info. This one is not application code; stdout is its entire output contract.
#
# A second entry for app/health/check.py was removed in the luxlint 0.42.0 bump: that
# release added `**/health/check.py` to the canonical T20 entrypoint carve-out (LUXSTATS-83,
# the fleet-wide fix this repo's evidence line said it was escalating for), so the per-repo
# entry stopped suppressing anything — and a carve-out that suppresses nothing is itself a
# red. Guard learns the pattern, every repo benefits; the local workaround retires.
[[allowlist.ruff]]
code     = "T201"
file     = "fake_kasa.py"
match    = "print("
evidence = "Standalone device-emulator server started as a container CMD; the one startup banner (flush=True) is read via `docker logs` by the e2e harness. The module configures no logging at all — stdout is deliberately its only output, the 'standalone script whose purpose is stdout' class the T20 carve-out already describes for scripts/ and ops/. Not reached by application code."

# This is a Python 3.14 app — check ruff/mypy at 3.14 so 3.12+/3.14 syntax
# (PEP 695 type aliases, etc.) is understood, not rejected against the fleet floor.
[python]
target = "py314"

# The coverage floor `make test` (luxarch's test block) ratchets against: branch coverage, whole
# percent, raised to 51% on 2026-10-10. Raise it as coverage rises; never lower it.
[test]
coverage_min = 51
