name: kasa-collector

# THE compose file for the collector — every stack, every environment (fleet standard:
# `luxarch --doc FLEET-BUILD-DEPLOY-STANDARD`, `--playbook compose-hygiene`).
#
# ONE file. Stacks differ by compose PROFILES (which services run); environments differ
# by `.env.<env>` (which values they run with). There is no overlay file and no second
# compose file — `repo.compose_conventions` enforces both.
#
#   docker compose --env-file .env.prod up -d     # collector -> your external InfluxDB
#   docker compose --env-file .env.dev  up -d     # + bundled InfluxDB & Grafana
#   docker compose --env-file .env.demo up -d     # fake devices + bundled stack, no hardware
#   make test-e2e                                 # hardware-free end-to-end, self-tearing-down
#
# Each env file selects its stack with COMPOSE_PROFILES:
#
#   profile     services                                            used by
#   ---------   -------------------------------------------------   -----------------
#   collector   kasa-collector (HOST network, real devices)          .env.prod, .env.dev
#   bundled     kasa_influxdb + kasa_grafana (dev, no host ports)    .env.dev
#   local       kasa_local_influxdb + kasa_local_grafana (published)  .env.local
#   demo        the local pair + fakes + kasa-collector-demo         .env.demo
#   e2e         throwaway InfluxDB + fakes + kasa-collector-e2e      make test-e2e
#   test        a throwaway InfluxDB the pytest suite writes to       make test
#
# THE DEV STACK RUNS ON THE DEV HOST (`DEV_HOST` in the Makefile; FLEET-BUILD-DEPLOY-STANDARD,
# "The dev host") and publishes no host port. Its Grafana joins the dev host's `dev-edge`
# network at its pinned address (172.30.0.15), where the edge serves it by its dev name. Its InfluxDB has
# a FIXED address on the `kasa_dev` network: the collector is on the host's network (it must
# be, for discovery), where no container name resolves, and a host-networked process reaches
# a bridge container by its address.
#
# THE LOCAL PAIR PUBLISHES PORTS, for stacks run on the machine that cloned the repo: the
# demo (fakes), and `collector,local` (your real devices + a bundled InfluxDB and Grafana on
# this machine, `make local-up`). The dev stack never starts the `local` profile.
#
# WHY THREE COLLECTOR SERVICES RATHER THAN ONE. `network_mode` cannot vary by profile —
# it is a property of a service. The real collector needs HOST networking to reach real
# devices on the LAN; the fake-device stacks need BRIDGE networking so the collector
# resolves the emulators by service name, which host networking cannot do. Those are
# three different services, not one service in three moods.
#
# Broadcast DOES work on a bridge — a Docker bridge is a Linux bridge and floods it, so
# the e2e stack exercises real discovery. The harness used to disable discovery on the
# assumption that it could not, which left the collector's primary path with no
# end-to-end coverage and is why three discovery bugs shipped (KASACOLLEC-70).
#
# Compose NEVER builds. Images are built outside it (`make dev-deploy`, `make release`,
# `make harness-build`, `make test-e2e`) and referenced here by an IMMUTABLE tag — the
# real collector runs `:sha-<commit>` (dev) or `:<version>` (prod), never `:dev`/`:latest`;
# the hardware-free stacks run bare local verification images (`*:test`).
#
# Real `.env.dev` / `.env.prod` are gitignored (TAG/REGISTRY/ports/secrets);
# `.env.example` is the committed template and `.env.demo` ships public defaults.

# What the dev and demo InfluxDB + Grafana pairs share; each service adds its profile,
# names, volumes and network. oom_score_adj -500: the stacks rank last for the OOM killer.
x-influx: &influx
  image: influxdb:2.7
  oom_score_adj: -500
  environment:
    DOCKER_INFLUXDB_INIT_MODE: setup
    DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
    DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
    DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
    DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
    DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
  healthcheck:
    test: ["CMD", "influx", "ping"]
    interval: 5s
    timeout: 3s
    retries: 30
  restart: unless-stopped

x-grafana: &grafana
  image: grafana/grafana:11.3.0
  oom_score_adj: -500
  environment: &grafana-env
    GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
    GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    GF_USERS_ALLOW_SIGN_UP: "false"
    INFLUX_BUCKET: ${INFLUX_BUCKET}
    INFLUX_TOKEN: ${INFLUX_TOKEN}
  restart: unless-stopped

services:
  # ── profile: collector ─────────────────────────────────────────────────────
  # The real collector against real hardware. Host networking for UDP discovery.
  kasa-collector:
    profiles: [collector]
    oom_score_adj: -500
    container_name: kasa-collector
    image: ${REGISTRY:?set REGISTRY in .env.<env>}/luxardolabs/kasa-collector:${TAG:?set TAG in .env.<env>}
    env_file:
      # The --env-file passed on the command line supplies compose interpolation, not
      # the container's environment, so the same file is listed here explicitly.
      # .env.dev.local (gitignored, optional) layers real device credentials on top;
      # the later file wins on shared keys.
      - ${ENV_FILE:?set ENV_FILE in .env.<env>}
      - path: .env.dev.local
        required: false
    network_mode: host
    restart: always
    healthcheck:
      test: ["CMD", "python3", "-m", "app.health.check"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    volumes:
      - ${OUTPUT_DIR:-/mnt/docker/kasa-collector/output}:/app/output

  # ── profile: bundled ───────────────────────────────────────────────────────
  # The dev stack's own InfluxDB + Grafana, on the dev host, with no host port. The
  # host-networked collector writes to InfluxDB at its fixed address (KASA_DEV_INFLUX_ADDR,
  # which .env.dev's KASA_COLLECTOR_INFLUXDB_URL names); Grafana reads it by service name.
  kasa_influxdb:
    <<: *influx
    profiles: [bundled]
    container_name: kasa_influxdb
    volumes:
      - kasa_influxdb_data:/var/lib/influxdb2
      # The image DECLARES /etc/influxdb2 too (the CLI config setup mode writes). Unmapped,
      # every `up` minted an anonymous volume and every `down` abandoned it.
      - kasa_influxdb_config:/etc/influxdb2
      - ./ops/influxdb/init-dbrp.sh:/docker-entrypoint-initdb.d/init-dbrp.sh:ro
    networks:
      kasa_dev:
        ipv4_address: ${KASA_DEV_INFLUX_ADDR:-10.210.250.10}

  kasa_grafana:
    <<: *grafana
    profiles: [bundled]
    container_name: kasa_grafana
    environment:
      <<: *grafana-env
      INFLUX_HOST: kasa_influxdb
    # Served by name on the dev host's edge, so it refuses a guessable admin password and
    # sets the one in the env file on every start (ops/grafana/dev-entrypoint.sh). The check
    # is in the container, not a required compose variable: compose interpolates every
    # service, and the e2e and test stacks set no Grafana password. A missing bind source
    # arrives as a directory, which sh would run as a silent exit 0.
    entrypoint: ["/bin/sh", "-c", "test -f /ops/dev-entrypoint.sh || { echo 'REFUSING: /ops/dev-entrypoint.sh is not mounted: run the dev stack from a checkout the dev host has at the same path' >&2; exit 1; }; exec /bin/sh /ops/dev-entrypoint.sh"]
    volumes:
      - ./ops/grafana/dev-entrypoint.sh:/ops/dev-entrypoint.sh:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/shared-local:/var/lib/grafana/dashboards:ro
      - kasa_grafana_data:/var/lib/grafana
    networks:
      kasa_dev: {}
      # The edge routes by PINNED address on dev-edge, never by name: any container on the
      # network can claim an alias. 172.30.0.15 is this Grafana's row in the edge's address
      # table (the edge repo's README, "The dev-edge network and the address table").
      dev-edge:
        ipv4_address: 172.30.0.15
    depends_on:
      kasa_influxdb:
        condition: service_healthy

  # ── profiles: local, demo ──────────────────────────────────────────────────
  # InfluxDB + Grafana on the machine that cloned the repo, so these two publish ports
  # (GRAFANA_PORT / INFLUX_PORT): the demo's, and the local real-device stack's, whose
  # host-networked collector writes to http://localhost:${INFLUX_PORT}.
  kasa_local_influxdb:
    <<: *influx
    profiles: [local, demo]
    container_name: kasa_local_influxdb
    volumes:
      - kasa_local_influxdb_data:/var/lib/influxdb2
      - kasa_local_influxdb_config:/etc/influxdb2
      - ./ops/influxdb/init-dbrp.sh:/docker-entrypoint-initdb.d/init-dbrp.sh:ro
    ports:
      - "${INFLUX_PORT:-8086}:8086"

  kasa_local_grafana:
    <<: *grafana
    profiles: [local, demo]
    container_name: kasa_local_grafana
    environment:
      <<: *grafana-env
      INFLUX_HOST: kasa_local_influxdb
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/shared-local:/var/lib/grafana/dashboards:ro
      - kasa_local_grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      kasa_local_influxdb:
        condition: service_healthy

  # ── profiles: demo, e2e ────────────────────────────────────────────────────
  # Fake Kasa devices (harness/fake_kasa.py, pure stdlib). One set serves both the
  # demo and the e2e test: the aliases are asserted on by scripts/e2e-test.sh, and a
  # demo that says "Fake" is more honest than one that says "Demo" anyway. The four
  # kinds cover every device path the collector ships: emeter plug, a second model,
  # a NON-emeter plug (the no-emeter branch), and a multi-outlet strip with per-outlet
  # emeter (the child-device path). A TEST FIXTURE: `make harness-build` builds it under a
  # BARE name and never pushes it, so a clean clone runs the demo with no registry.
  kasa_fake_hs110:
    profiles: [demo, e2e]
    oom_score_adj: -500
    image: kasa-collector-fake:test
    environment:
      KASA_FAKE_KIND: plug
      KASA_FAKE_MODEL: HS110(US)
      KASA_FAKE_ALIAS: Fake HS110 Plug
      KASA_FAKE_MAC: "50:C7:BF:00:00:10"
      KASA_FAKE_BASE_W: "42"
    restart: unless-stopped

  kasa_fake_kp115:
    profiles: [demo, e2e]
    oom_score_adj: -500
    image: kasa-collector-fake:test
    environment:
      KASA_FAKE_KIND: plug
      KASA_FAKE_MODEL: KP115(US)
      KASA_FAKE_ALIAS: Fake KP115 Plug
      KASA_FAKE_MAC: "50:C7:BF:00:00:11"
      KASA_FAKE_BASE_W: "88"
    restart: unless-stopped

  # Plug WITHOUT energy monitoring — exercises the no-emeter branch. It must be
  # handled cleanly and must NOT write emeter data; e2e asserts both.
  kasa_fake_hs103:
    profiles: [demo, e2e]
    oom_score_adj: -500
    image: kasa-collector-fake:test
    environment:
      KASA_FAKE_KIND: plug_noemeter
      KASA_FAKE_MODEL: HS103(US)
      KASA_FAKE_ALIAS: Fake HS103 Plug
      KASA_FAKE_MAC: "50:C7:BF:00:00:12"
    restart: unless-stopped

  kasa_fake_hs300:
    profiles: [demo, e2e]
    oom_score_adj: -500
    image: kasa-collector-fake:test
    environment:
      KASA_FAKE_KIND: strip
      KASA_FAKE_MODEL: HS300(US)
      KASA_FAKE_ALIAS: Fake HS300 Strip
      KASA_FAKE_MAC: "50:C7:BF:00:00:13"
      KASA_FAKE_BASE_W: "30"
      KASA_FAKE_OUTLETS: "6"
    restart: unless-stopped

  # A plug on legacy firmware (HS110 hardware v1: A / V / W / kWh floats). e2e only: it
  # proves its readings are written in the dashboards' milli-units, not truncated.
  kasa_fake_legacy:
    profiles: [e2e]
    oom_score_adj: 500
    image: kasa-collector-fake:test
    environment:
      KASA_FAKE_KIND: plug
      KASA_FAKE_MODEL: HS110(EU)
      KASA_FAKE_ALIAS: Fake Legacy Plug
      KASA_FAKE_MAC: "50:C7:BF:00:00:16"
      KASA_FAKE_BASE_W: "12"
      KASA_FAKE_LEGACY_UNITS: "true"
    restart: unless-stopped

  # A strip whose outlets share one name, as a user leaves them. e2e only: it proves each
  # outlet still gets its own series (plug_id), not one series per alias.
  kasa_fake_twin_strip:
    profiles: [e2e]
    oom_score_adj: 500
    image: kasa-collector-fake:test
    environment:
      KASA_FAKE_KIND: strip
      KASA_FAKE_MODEL: HS300(US)
      KASA_FAKE_ALIAS: Fake Twin Strip
      KASA_FAKE_MAC: "50:C7:BF:00:00:15"
      KASA_FAKE_BASE_W: "20"
      KASA_FAKE_OUTLETS: "2"
      KASA_FAKE_OUTLET_ALIAS: Twin
    restart: unless-stopped

  # A SMART power strip over KLAP v2 (harness/fake_smart.py): six outlets that each
  # measure their own energy, logged in with the e2e collector's TP-Link account. e2e
  # only: it proves a SMART strip yields its total AND one series per outlet.
  kasa_fake_p316m:
    profiles: [e2e]
    oom_score_adj: 500
    image: kasa-collector-fake:test
    command: ["python3", "/fake_smart.py"]
    environment:
      KASA_FAKE_ALIAS: Fake P316M Strip
      KASA_FAKE_MODEL: P316M(US)
      KASA_FAKE_OUTLETS: "6"
      KASA_FAKE_BASE_W: "20"
      KASA_FAKE_USERNAME: e2e-account@example.invalid
      KASA_FAKE_PASSWORD: e2e-fake-device-login
    restart: unless-stopped

  # An HS300 behind KLAP, as firmware 1.1.2 serves it: no XOR listener, discovered on
  # UDP 20002 as IOT.SMARTPLUGSWITCH over KLAP v2. python-kasa's discovery builds it as
  # an IotPlug; e2e proves the collector's re-class still collects every outlet.
  kasa_fake_klap_hs300:
    profiles: [e2e]
    oom_score_adj: 500
    image: kasa-collector-fake:test
    command: ["python3", "/fake_smart.py"]
    environment:
      KASA_FAKE_PROTOCOL: iot
      KASA_FAKE_KIND: strip
      KASA_FAKE_MODEL: HS300(US)
      KASA_FAKE_ALIAS: Fake KLAP HS300
      KASA_FAKE_MAC: "50:C7:BF:00:00:17"
      KASA_FAKE_BASE_W: "25"
      KASA_FAKE_OUTLETS: "6"
      KASA_FAKE_USERNAME: e2e-account@example.invalid
      KASA_FAKE_PASSWORD: e2e-fake-device-login
    restart: unless-stopped

  # Deaf to broadcast discovery, reachable by direct query -- the KASACOLLEC-70 shape.
  # e2e only: it exists to prove a device that discovery stops seeing keeps collecting.
  kasa_fake_deaf:
    profiles: [e2e]
    oom_score_adj: 500
    image: kasa-collector-fake:test
    environment:
      KASA_FAKE_KIND: plug
      KASA_FAKE_MODEL: KP115(US)
      KASA_FAKE_ALIAS: Fake Deaf Plug
      KASA_FAKE_MAC: "50:C7:BF:00:00:14"
      KASA_FAKE_BASE_W: "55"
      # Discovered normally, then invisible to broadcast from 45s on.
      KASA_FAKE_DEAF_AFTER: "45"
    restart: unless-stopped

  # ── profile: demo ──────────────────────────────────────────────────────────
  # Collector on the BRIDGE, pointed at the fakes by service name. Discovery is off:
  # a broadcast cannot reach a bridge network, so the emulators are named explicitly.
  kasa-collector-demo:
    profiles: [demo]
    oom_score_adj: -500
    container_name: kasa-collector-demo
    image: ${REGISTRY:?set REGISTRY in .env.<env>}/luxardolabs/kasa-collector:${TAG:?set TAG in .env.<env>}
    env_file:
      - ${ENV_FILE:-.env.demo}
    environment:
      KASA_COLLECTOR_INFLUXDB_URL: http://kasa_local_influxdb:8086
      KASA_COLLECTOR_ENABLE_AUTO_DISCOVERY: "False"
      KASA_COLLECTOR_DEVICE_HOSTS: kasa_fake_hs110,kasa_fake_kp115,kasa_fake_hs103,kasa_fake_hs300
      KASA_COLLECTOR_DATA_FETCH_INTERVAL: "5"
    restart: unless-stopped
    depends_on:
      kasa_local_influxdb:
        condition: service_healthy
      kasa_fake_hs110:
        condition: service_started
      kasa_fake_kp115:
        condition: service_started
      kasa_fake_hs103:
        condition: service_started
      kasa_fake_hs300:
        condition: service_started

  # ── profile: e2e ───────────────────────────────────────────────────────────
  # Throwaway InfluxDB for the hardware-free test. NO published ports, so it never
  # collides with the dev/demo stack or a sibling app and is safe in CI.
  #
  # tmpfs, not a named volume: the image DECLARES /var/lib/influxdb2 and /etc/influxdb2,
  # so leaving them unmapped mints a fresh anonymous volume on every `up` and abandons
  # it on every `down` — the disk-filler `repo.compose_db_ephemeral_volume` exists to
  # catch (KASACOLLEC-46). Throwaway data belongs in tmpfs; persistent data takes a
  # named volume, as the bundled InfluxDB above does.
  kasa_e2e_influxdb:
    profiles: [e2e]
    oom_score_adj: 500
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: kasa
      DOCKER_INFLUXDB_INIT_PASSWORD: kasa-e2e-password
      DOCKER_INFLUXDB_INIT_ORG: kasa
      DOCKER_INFLUXDB_INIT_BUCKET: kasa
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: kasa-e2e-token
    volumes:
      - ./ops/influxdb/init-dbrp.sh:/docker-entrypoint-initdb.d/init-dbrp.sh:ro
    tmpfs:
      - /var/lib/influxdb2
      - /etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # ── profile: test ──────────────────────────────────────────────────────────
  # The real InfluxDB `make test` starts (TEST_SERVICES), one isolated compose project per
  # run. No container_name, no ports, no bind mounts: the test block's isolation contract.
  # tmpfs for both declared VOLUMEs, so a run leaves nothing behind.
  kasa_test_influxdb:
    profiles: [test]
    oom_score_adj: 500
    image: influxdb:2.7
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: kasa
      DOCKER_INFLUXDB_INIT_PASSWORD: kasa-test-password
      DOCKER_INFLUXDB_INIT_ORG: kasa
      DOCKER_INFLUXDB_INIT_BUCKET: kasa
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: kasa-test-token
    tmpfs:
      - /var/lib/influxdb2
      - /etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # The runtime stage built from current source by `make test-e2e`, under the BARE
  # verification name: never pushed, so the test needs no registry (`<repo>-e2e:test`).
  kasa-collector-e2e:
    profiles: [e2e]
    oom_score_adj: 500
    image: kasa-collector-e2e:test
    environment:
      # DISCOVERY, not explicit hosts. A Docker bridge is a Linux bridge and floods
      # broadcast, so 255.255.255.255 reaches every emulator on it -- verified. The
      # harness previously disabled discovery on the assumption that it could not,
      # which left the collector's primary path with no end-to-end coverage at all.
      KASA_COLLECTOR_ENABLE_AUTO_DISCOVERY: "True"
      KASA_COLLECTOR_DEVICE_DISCOVERY_INTERVAL: "15"
      KASA_COLLECTOR_DISCOVERY_MISS_THRESHOLD: "1"
      KASA_COLLECTOR_INFLUXDB_URL: http://kasa_e2e_influxdb:8086
      KASA_COLLECTOR_INFLUXDB_ORG: kasa
      KASA_COLLECTOR_INFLUXDB_BUCKET: kasa
      KASA_COLLECTOR_INFLUXDB_TOKEN: kasa-e2e-token
      # The account kasa_fake_p316m accepts: a fake device's login, not a real one.
      KASA_COLLECTOR_TPLINK_USERNAME: e2e-account@example.invalid
      KASA_COLLECTOR_TPLINK_PASSWORD: e2e-fake-device-login
      KASA_COLLECTOR_DATA_FETCH_INTERVAL: "5"
      KASA_COLLECTOR_SYSINFO_FETCH_INTERVAL: "10"
      KASA_COLLECTOR_WRITE_TO_FILE: "False"
      KASA_COLLECTOR_KEEP_MISSING_DEVICES: "False"
      KASA_COLLECTOR_LOG_LEVEL_KASA_COLLECTOR: INFO
      KASA_COLLECTOR_LOG_LEVEL_KASA_API: INFO
      KASA_COLLECTOR_LOG_LEVEL_INFLUXDB_STORAGE: INFO
    depends_on:
      kasa_e2e_influxdb:
        condition: service_healthy
      kasa_fake_deaf:
        condition: service_started
      kasa_fake_hs110:
        condition: service_started
      kasa_fake_kp115:
        condition: service_started
      kasa_fake_hs103:
        condition: service_started
      kasa_fake_hs300:
        condition: service_started
      kasa_fake_twin_strip:
        condition: service_started
      kasa_fake_legacy:
        condition: service_started
      kasa_fake_p316m:
        condition: service_started
      kasa_fake_klap_hs300:
        condition: service_started

networks:
  # The dev pair's network, on a PINNED subnet so InfluxDB keeps one address the
  # host-networked collector can be told. Inside the dev host's Docker address pool
  # (10.210.0.0/16, allocated /24 by /24 from the bottom), at its top, so it never takes a
  # range the pool would hand another stack first; the pool skips it once it exists.
  # Override both in .env.dev if a host needs another range.
  kasa_dev:
    ipam:
      config:
        - subnet: ${KASA_DEV_SUBNET:-10.210.250.0/24}
  # The dev host's edge (FLEET-BUILD-DEPLOY-STANDARD, "The dev host"): only the dev
  # Grafana joins it (pinned at 172.30.0.15), so only the dev stack needs it to exist.
  dev-edge:
    external: true

volumes:
  kasa_influxdb_data:
  kasa_influxdb_config:
  kasa_grafana_data:
  kasa_local_influxdb_data:
  kasa_local_influxdb_config:
  kasa_local_grafana_data:
