# Grafana datasource for the bundled InfluxDB. The dashboards use InfluxQL and
# reference datasource uid "uDxwFcOGz", so this pins that uid. Auth to InfluxDB
# 2.x's v1-compat API is via an Authorization: Token header. Values come from the
# env compose passes into the Grafana container: INFLUX_HOST names that stack's
# InfluxDB service (kasa_influxdb for dev, kasa_local_influxdb for local and demo).
apiVersion: 1

datasources:
  - name: InfluxDB
    uid: uDxwFcOGz
    type: influxdb
    access: proxy
    url: http://${INFLUX_HOST}:8086
    isDefault: true
    jsonData:
      version: InfluxQL
      dbName: ${INFLUX_BUCKET}
      httpMode: GET
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: Token ${INFLUX_TOKEN}
    editable: true
